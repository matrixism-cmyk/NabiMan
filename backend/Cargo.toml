[package]
name = "nabiman-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
actix-web-actors = "4"
actix = "0.13"
nix = { version = "0.29", features = ["term", "process", "fs", "signal", "ioctl"] }
libc = "0.2"
