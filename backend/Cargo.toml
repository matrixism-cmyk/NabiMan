[package]
name = "nabiman-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
actix-web-actors = "4"
actix = "0.13"
nix = { version = "0.29", features = ["term", "process", "fs", "signal", "ioctl"] }
libc = "0.2"
bcrypt = "0.16"
jsonwebtoken = "9"
rand = "0.8"
totp-rs = { version = "5", features = ["qr"] }
base32 = "0.5"

# MEC Management 모듈
kube = { version = "0.95", features = ["runtime", "derive", "rustls-tls"], default-features = false }
k8s-openapi = { version = "0.23", features = ["latest"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
russh = "0.44"
russh-keys = "0.44"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
docx-rs = "0.4"

[dev-dependencies]
actix-rt = "2"
actix-test = "0.1"
