version: '3.8'

services:
  nabiman:
    build:
      context: .
      args:
        # export NABIMAN_GIT_COMMIT=$(git rev-parse HEAD) before `docker compose build`
        NABIMAN_GIT_COMMIT: ${NABIMAN_GIT_COMMIT:-}
    container_name: nabiman
    ports:
      - "8080:8080"
    volumes:
      - nabiman-data:/var/lib/nabiman
    environment:
      - NABIMAN_PORT=8080
      - NABIMAN_PASSWORD=${NABIMAN_PASSWORD:?Set a strong NABIMAN_PASSWORD before starting}
    restart: unless-stopped

volumes:
  nabiman-data:
