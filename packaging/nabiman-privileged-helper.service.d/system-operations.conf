# Drop-in for nabiman-privileged-helper.service when privileged-system.json
# approves firewall rules or package upgrades. `install.sh --mode service`
# installs it as /etc/systemd/system/nabiman-privileged-helper.service.d/.
#
# Service control alone fits the helper's tight sandbox. Firewall rules need
# CAP_NET_ADMIN and netlink; package upgrades run maintainer scripts that
# write /usr, /etc, /boot, set setuid bits, load modules, add users and use
# su. That is root's work, so the sandbox is lifted for it. The boundary that
# remains is the protocol: typed operations, fixed argv, root policy files.
# Without this drop-in those operations fail inside the sandbox (reported to
# the API as failed, never run elsewhere).
[Service]
NoNewPrivileges=no
ProtectSystem=no
ProtectHome=no
PrivateDevices=no
PrivateTmp=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictNamespaces=no
RestrictAddressFamilies=
CapabilityBoundingSet=~
ReadWritePaths=
TasksMax=512
MemoryMax=2G
LimitNOFILE=4096
