name: Release

on:
  push:
    tags: ['v*']

# Building runs third-party build scripts (npm, cargo); it gets no secrets and
# no write access. Only the `publish` job sees the signing key.
permissions:
  contents: read

jobs:
  build:
    # Native builds on both architectures: the release smoke test starts the
    # packaged server, which a cross build could not do. ubuntu-24.04-arm is a
    # GitHub-hosted arm64 runner (free for public repositories; a private
    # repository needs a plan with arm64 larger runners, or switch this entry
    # to `cross build --target aarch64-unknown-linux-gnu` on x86_64 and drop
    # its smoke step; see docs/release/README.md).
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: nabiman-linux-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Release signing key is set up
        run: python3 scripts/check-release-key.py

      - name: Tag matches the package versions
        run: |
          tag=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/Cargo.toml | head -n1)
          npm_version=$(python3 -c 'import json;print(json.load(open("frontend/package.json"))["version"])')
          echo "tag $tag, backend $cargo_version, frontend $npm_version"
          test "$tag" = "$cargo_version" && test "$tag" = "$npm_version"

      - name: Base images pinned by digest
        run: bash scripts/check-docker-pins.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit
          npm audit --omit=dev
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm test -- --watch=false --runInBand
          npm run build

      # One fixed toolchain for release builds (the Dockerfile uses the same).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build backend
        working-directory: backend
        env:
          # The tag's commit, recorded in the binary (build.rs) even if the
          # checkout's git metadata is shallow or missing.
          NABIMAN_GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p static
          cp -r ../frontend/build/* static/
          cargo test --locked
          cargo build --release --locked

      - name: Verify backend HTTP dependency boundary
        run: python3 scripts/verify-http-dependencies.py

      - name: Package
        env:
          NABIMAN_VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/package-release.sh \
            backend/target/release/nabiman-server frontend/build release
          cd release
          sha256sum -c "$ASSET.sha256"
          tar -tzf "$ASSET" | grep -Fx 'nabiman/static/index.html'
          cd ..
          python3 scripts/smoke-release.py "release/$ASSET"

      - name: Validate release manifest and CycloneDX inventory
        run: |
          python3 scripts/test-release-verification.py
          python3 -m venv "$RUNNER_TEMP/nabiman-sbom-validation"
          "$RUNNER_TEMP/nabiman-sbom-validation/bin/pip" install 'jsonschema[format-nongpl]==4.23.0' 'cryptography==43.0.3'
          "$RUNNER_TEMP/nabiman-sbom-validation/bin/python" scripts/test-release-signature.py
          "$RUNNER_TEMP/nabiman-sbom-validation/bin/python" scripts/test-release-licenses.py
          "$RUNNER_TEMP/nabiman-sbom-validation/bin/python" scripts/test-nabiman-update.py
          "$RUNNER_TEMP/nabiman-sbom-validation/bin/python" scripts/validate-sbom.py "release/$ASSET.cdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Protect this environment (Settings -> Environments -> release: required
    # reviewers, tag rule v*) and keep the signing secrets there, not repo-wide.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign release assets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY secret is not set" >&2; exit 1; }
          cp install.sh release/install.sh
          key="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          cd release
          for f in *.tar.gz *.sha256 *.cdx.json *.manifest.json *.inventory.json *.licenses.json verify-release.py install.sh; do
            # The trusted comment is signed too: installers check file: and show version:.
            if [ -n "$MINISIGN_PASSWORD" ]; then
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$f" -t "nabiman version:$TAG file:$f"
            else
              minisign -S -s "$key" -m "$f" -t "nabiman version:$TAG file:$f" </dev/null
            fi
          done
          rm -f "$key"
      - name: Verify signatures with the repository key
        run: |
          cd release
          for f in *.minisig; do minisign -V -p ../docs/release/nabiman-release.pub -m "${f%.minisig}"; done
          for a in nabiman-linux-*.tar.gz; do
            python3 ../scripts/verify-release.py "$a" --public-key-file ../docs/release/nabiman-release.pub --require-signature
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nabiman-linux-*.tar.gz
            release/*.sha256
            release/*.cdx.json
            release/*.manifest.json
            release/*.inventory.json
            release/*.licenses.json
            release/*.minisig
            release/verify-release.py
            release/install.sh
